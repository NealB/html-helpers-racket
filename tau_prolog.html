print_query_list_raw = function (html) {
	//console.log(`arguments->`, arguments);
	$('<div>').html(html).css('margin-bottom', '3px').appendTo('#query-list');
};


print_query_list = function (text) {
	//console.log(`arguments->`, arguments);
	$('<div>').text(text).css('margin-bottom', '3px').appendTo('#query-list');
};

print_query_list_error = function (text) {
	$('<div>').addClass('text-danger').html(text).appendTo('#query-list');
};

add_query_to_localStorage = function(query) {
	const qHist = JSON.parse(localStorage.queryHistory);
	const index = qHist.indexOf(query);
	if(index >= 0) {
		qHist.splice(index, 1);
	}
	qHist.push(query);
	localStorage.queryHistory = JSON.stringify(qHist);

	const $matching = $('#query-history option').filter(function() {
			return $(this).text() === query;
		}).remove();

	$('<option>').attr('value', query).text(query).appendTo('#query-history');
};

run_query = async function(query) {
	try {
		console.log(`running query: ${query}`);

		add_query_to_localStorage(query);

		await session.promiseQuery(query);
		for await (let answer of session.promiseAnswers()) {
			console.log(`${query} ---> format answer: ${session.format_answer(answer)}`);

			//console.log(`unformatted answer:`, answer);
			window.lastAnswer = answer;
			for(let varName of Object.keys(answer.links)) {
				print_query_list(`${varName} = ${answer.links[varName].toString()}`);
			}
			if(Object.keys(answer.links).length > 1) {
				print_query_list_raw(`&nbsp;`);
			}
			//break;
		}
	}
	catch(e) {
		print_query_list_error(e.toString());
		console.error(e.toString());
		window.lastException = e;
	}
	const queries = document.getElementById('queries');
	queries.scrollTo(0, queries.scrollHeight);
};

$(function() {
	if(!localStorage.queryHistory) {
		localStorage.queryHistory = '[]';
	}
	else {
		const qHist = JSON.parse(localStorage.queryHistory);
		for(let item of qHist) {
			$('<option>').attr('value', item).text(item).appendTo('#query-history');
			
		}
	}
});
